services:
  db:
    image: imresamu/postgis:15-3.4
    container_name: kvk_postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kvkuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kvkpass}
      POSTGRES_DB: ${POSTGRES_DB:-kvk_db}
    ports:
      - "5433:5432"
    volumes:
      - kvk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kvkuser} -d ${POSTGRES_DB:-kvk_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kvk_pgdata: